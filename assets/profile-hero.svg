<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350" role="img" aria-label="Gaerisson profile header with dark gradient background, subtle circuits and abstract developer-themed shapes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111d"/>
      <stop offset="55%" stop-color="#0d1d31"/>
      <stop offset="100%" stop-color="#091523"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27d0dd" stop-opacity="0"/>
      <stop offset="35%" stop-color="#27d0dd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#27d0dd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orangeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffab5c" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffab5c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffab5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f8fb"/>
      <stop offset="55%" stop-color="#d7edf0"/>
      <stop offset="100%" stop-color="#b9e3e8"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1ed2e5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1ed2e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9955" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff9955" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7da1b8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect width="1400" height="350" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1400" height="350" fill="url(#bg)"/>
    <rect width="1400" height="350" fill="url(#grid)"/>

    <ellipse cx="1090" cy="115" rx="210" ry="150" fill="url(#glowCyan)"/>
    <ellipse cx="1215" cy="245" rx="180" ry="115" fill="url(#glowOrange)"/>

    <g fill="#33d7e2" opacity="0.45">
      <circle cx="890" cy="57" r="2.1"/>
      <circle cx="1022" cy="98" r="1.7"/>
      <circle cx="1182" cy="84" r="2.3"/>
      <circle cx="1308" cy="138" r="1.8"/>
      <circle cx="934" cy="264" r="1.6"/>
      <circle cx="1085" cy="288" r="2.0"/>
      <circle cx="1276" cy="248" r="1.8"/>
    </g>
    <g fill="#ffab67" opacity="0.35">
      <circle cx="955" cy="120" r="1.6"/>
      <circle cx="1126" cy="62" r="2.0"/>
      <circle cx="1247" cy="182" r="1.5"/>
      <circle cx="1191" cy="296" r="2.2"/>
    </g>

    <text x="72" y="138" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#7be0e8" letter-spacing="2.5">HELLO, I'M</text>
    <text x="72" y="212" font-size="76" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" fill="url(#wordmark)">Gaerisson</text>
    <text x="72" y="252" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#dce7ef" opacity="0.92">IT Engineer · Creative Developer · AI Explorer</text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#9fb4c5">
      <text x="74" y="300">Infrastructure · Self-hosting · Automation · AI · Photography · Maker projects</text>
    </g>

    <rect x="72" y="270" width="420" height="3" rx="2" fill="url(#cyanLine)"/>
    <rect x="72" y="279" width="250" height="2" rx="1" fill="url(#orangeLine)"/>

    <g transform="translate(860 54)">
      <rect x="0" y="0" width="460" height="242" rx="18" fill="#0b1828" fill-opacity="0.45" stroke="#2a4558"/>
      <rect x="28" y="26" width="182" height="88" rx="14" fill="#0d2134" stroke="#31566a"/>
      <circle cx="47" cy="44" r="4" fill="#ff9862"/>
      <circle cx="61" cy="44" r="4" fill="#ffd36f"/>
      <circle cx="75" cy="44" r="4" fill="#38d2dc"/>
      <text x="45" y="80" font-size="27" font-family="Consolas, Menlo, monospace" fill="#83e7ed">&lt;/&gt;</text>
      <text x="45" y="101" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#8ba9bc">build · test · improve</text>

      <rect x="232" y="26" width="200" height="88" rx="14" fill="#0d2134" stroke="#31566a"/>
      <text x="256" y="59" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#dfe9ee">Current focus</text>
      <rect x="256" y="74" width="75" height="22" rx="11" fill="#143348" stroke="#35cfde"/>
      <text x="274" y="89" font-size="12" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#cdeff1">AI</text>
      <rect x="341" y="74" width="83" height="22" rx="11" fill="#2d2430" stroke="#ffab67"/>
      <text x="356" y="89" font-size="12" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#ffe0ca">Automation</text>

      <rect x="28" y="132" width="404" height="82" rx="14" fill="#0d2134" stroke="#31566a"/>
      <path d="M50 182 H108 L135 155 H199 L224 176 H272 L302 145 H366" fill="none" stroke="#2fd1de" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
      <path d="M50 196 H95 L126 170 H175 L206 185 H242 L280 161 H332 L366 184" fill="none" stroke="#ffad66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      <text x="50" y="158" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#95aabc">building ideas into projects</text>

      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M420 22 H452" stroke="#31d0dd" stroke-width="2" opacity="0.85"/>
        <path d="M452 22 V56 H485" stroke="#31d0dd" stroke-width="2" opacity="0.85"/>
        <path d="M438 96 H492" stroke="#ffad66" stroke-width="2" opacity="0.75"/>
        <path d="M-36 172 H0" stroke="#31d0dd" stroke-width="2" opacity="0.65"/>
        <path d="M-58 194 H-8" stroke="#ffad66" stroke-width="2" opacity="0.45"/>
      </g>
    </g>

    <g fill="none" stroke-width="1.5" opacity="0.38">
      <path d="M28 54 H142 L182 94 H282" stroke="#39ced8"/>
      <path d="M188 332 H276 L324 287 H412" stroke="#ffab66"/>
      <path d="M1310 298 H1360 V256 H1399" stroke="#39ced8"/>
      <path d="M1250 38 H1328 V68 H1399" stroke="#ffab66"/>
    </g>

    <rect x="1" y="1" width="1398" height="348" rx="18" fill="none" stroke="#254153" stroke-opacity="0.7"/>
  </g>
</svg>
